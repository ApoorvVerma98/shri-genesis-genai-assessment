        </g>
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#F8FAFC" x="32" y="72"><tspan x="32" dy="0">Boost Digital Literacy for Seniors: A Community</tspan><tspan x="32" dy="51.2">Guide</tspan></text>
    <text x="32" y="105.2" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8">Empower older adults with essential tech skills and confidence through accessible training and supportive resources.</text>
    
        <rect x="32" y="158.4" width="558" height="148" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
        <text x="56" y="214.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#22D3EE">Half to three-quarters*</text>
        <text x="56" y="250.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC">Seniors Engaged in Digital Training</text>
        <text x="56" y="280.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">Percentage of seniors attending workshops</text>
      
        <rect x="610" y="158.4" width="558" height="148" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
        <text x="634" y="214.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#22D3EE">Moderate to High*</text>
        <text x="634" y="250.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC">Average Skill Improvement</text>
        <text x="634" y="280.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">Self-reported confidence increase</text>
      
        <rect x="32" y="326.4" width="558" height="148" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
        <text x="56" y="382.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#22D3EE">5–10*</text>
        <text x="56" y="418.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC">Digital Tools Adopted</text>
        <text x="56" y="448.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">Typical number of devices used</text>
      
        <rect x="610" y="326.4" width="558" height="148" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
        <text x="634" y="382.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#22D3EE">Monthly*</text>
        <text x="634" y="418.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC">Community Support Sessions</text>
        <text x="634" y="448.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">Frequency of follow-up meetings</text>
      
    <text x="32" y="598" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">* Illustrative metrics unless sourced</text>
  
