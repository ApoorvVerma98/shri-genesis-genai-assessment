  <title>Boost Digital Literacy for Seniors: A Community Guide</title>
  <desc>Digital literacy for seniors</desc>
  
    <rect width="100%" height="100%" fill="#0B1220" />
    
        <g opacity="0.4" id="motif-nodes">
          <circle cx="936" cy="176.4" r="6" fill="#F472B6" />
          <circle cx="1056" cy="239.4" r="4" fill="#22D3EE" />
