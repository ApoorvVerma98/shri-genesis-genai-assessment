<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Empowering Seniors: A Warm Digital Literacy Journey">
  <title>Empowering Seniors: A Warm Digital Literacy Journey</title>
  <desc>Digital literacy for seniors (variant 2)</desc>
  
    <rect width="100%" height="100%" fill="#0B1220" />
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#F8FAFC" x="32" y="72"><tspan x="32" dy="0">Empowering Seniors: A Warm Digital Literacy</tspan><tspan x="32" dy="51.2">Journey</tspan></text>
    <line x1="32" y1="119.2" x2="1168" y2="119.2" stroke="#334155" stroke-width="2" />
    <g transform="translate(0, 143.2)">
      
          <rect x="32" y="0" width="275" height="430.8" rx="12" fill="#141C2F" stroke="#22D3EE" stroke-width="3" />
          <circle cx="169.5" cy="40" r="24" fill="#22D3EE" />
          <text x="169.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0B1220">1</text>
          <text x="48" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#F8FAFC">Identify Needs</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8" x="48" y="124"><tspan x="48" dy="0">Ask seniors about their</tspan><tspan x="48" dy="23">online habits,</tspan><tspan x="48" dy="23">interests, and</tspan><tspan x="48" dy="23">challenges to tailor the</tspan><tspan x="48" dy="23">learning path.</tspan></text>
        
          <rect x="319" y="0" width="275" height="430.8" rx="12" fill="#141C2F" stroke="#22D3EE" stroke-width="2" />
          <circle cx="456.5" cy="40" r="24" fill="#22D3EE" />
          <text x="456.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0B1220">2</text>
          <text x="335" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#F8FAFC">Choose Accessible Tools</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8" x="335" y="124"><tspan x="335" dy="0">Select devices and apps</tspan><tspan x="335" dy="23">with large fonts, clear</tspan><tspan x="335" dy="23">icons, and</tspan><tspan x="335" dy="23">straightforward</tspan><tspan x="335" dy="23">navigation.</tspan></text>
        
          <rect x="606" y="0" width="275" height="430.8" rx="12" fill="#141C2F" stroke="#22D3EE" stroke-width="2" />
          <circle cx="743.5" cy="40" r="24" fill="#22D3EE" />
          <text x="743.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0B1220">3</text>
          <text x="622" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#F8FAFC">Teach Core Skills</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8" x="622" y="124"><tspan x="622" dy="0">Cover basics like email,</tspan><tspan x="622" dy="23">video calls, and safe</tspan><tspan x="622" dy="23">browsing, using hands‑on</tspan><tspan x="622" dy="23">demos.</tspan></text>
        
          <rect x="893" y="0" width="275" height="430.8" rx="12" fill="#141C2F" stroke="#22D3EE" stroke-width="2" />
          <circle cx="1030.5" cy="40" r="24" fill="#22D3EE" />
          <text x="1030.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0B1220">4</text>
          <text x="909" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#F8FAFC">Reinforce &amp; Support</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8" x="909" y="124"><tspan x="909" dy="0">Schedule regular</tspan><tspan x="909" dy="23">check‑ins, create</tspan><tspan x="909" dy="23">peer‑support groups, and</tspan><tspan x="909" dy="23">provide easy‑to‑follow</tspan><tspan x="909" dy="23">guides.</tspan></text>
        
    </g>
  
</svg>