<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Zero‑Trust for Remote Teams: The New Baseline">
  <title>Zero‑Trust for Remote Teams: The New Baseline</title>
  <desc>Zero-trust for remote teams (variant 2)</desc>
  
    <rect width="100%" height="100%" fill="#0F1A14" />
    <rect x="0" y="0" width="1200" height="128" fill="#1A2B22" />
    <g transform="translate(32,40)"><path d="M24 8 L40 16 v16 a12 12 0 0 1 -24 0 v-16 Z" fill="none" stroke="#4ADE80" stroke-width="3"/></g>
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#ECFDF5" x="104" y="78"><tspan x="104" dy="0">Zero‑Trust for Remote Teams: The New Baseline</tspan></text>
    <text x="1168" y="78" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#86EFAC">infographic</text>
    <rect x="32" y="156" width="552" height="444" rx="16" fill="#1A2B22" stroke="#3F5E4F" stroke-width="2" />
    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="56" y="196"><tspan x="56" dy="0">As remote work expands, zero‑trust principles</tspan><tspan x="56" dy="23">eliminate implicit trust zones, ensuring every</tspan><tspan x="56" dy="23">request is authenticated, authorized, and</tspan><tspan x="56" dy="23">encrypted.</tspan></text>
    <g transform="translate(616, 156)">
      
        <rect y="0" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="38" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">1</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="38"><tspan x="48" dy="0">Define secure perimeters around each device, not</tspan><tspan x="48" dy="23">the network.</tspan></text>
      
        <rect y="108" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="146" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">2</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="146"><tspan x="48" dy="0">Enforce multi‑factor authentication for every</tspan><tspan x="48" dy="23">access attempt.</tspan></text>
      
        <rect y="216" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="254" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">3</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="254"><tspan x="48" dy="0">Apply least‑privilege policies dynamically based</tspan><tspan x="48" dy="23">on user context.</tspan></text>
      
        <rect y="324" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="362" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">4</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="362"><tspan x="48" dy="0">Continuously monitor and audit activity to detect</tspan><tspan x="48" dy="23">anomalies in real time.</tspan></text>
      
    </g>
  
</svg>