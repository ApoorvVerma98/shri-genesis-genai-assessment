<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Master Incident Response with Scenario‑Based Tabletop Drills">
  <title>Master Incident Response with Scenario‑Based Tabletop Drills</title>
  <desc>Incident response tabletop drills (variant 2)</desc>
  
    <rect width="100%" height="100%" fill="#1C1410" />
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#FFF7ED" x="32" y="72"><tspan x="32" dy="0">Master Incident Response with Scenario‑Based</tspan><tspan x="32" dy="51.2">Tabletop Drills</tspan></text>
    <line x1="32" y1="119.2" x2="1168" y2="119.2" stroke="#5C4033" stroke-width="2" />
    <g transform="translate(0, 143.2)">
      
          <rect x="32" y="0" width="275" height="430.8" rx="8" fill="#2A1F18" stroke="#FB923C" stroke-width="3" />
          <circle cx="169.5" cy="40" r="24" fill="#FB923C" />
          <text x="169.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1410">1</text>
          <text x="48" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FFF7ED">Set Objectives &amp; Scope</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FDBA74" x="48" y="124"><tspan x="48" dy="0">Identify the incident</tspan><tspan x="48" dy="23">types, response phases,</tspan><tspan x="48" dy="23">and success metrics to</tspan><tspan x="48" dy="23">guide the exercise.</tspan></text>
        
          <rect x="319" y="0" width="275" height="430.8" rx="8" fill="#2A1F18" stroke="#FB923C" stroke-width="2.5" />
          <circle cx="456.5" cy="40" r="24" fill="#FB923C" />
          <text x="456.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1410">2</text>
          <text x="335" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FFF7ED">Build the Team</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FDBA74" x="335" y="124"><tspan x="335" dy="0">Assemble analysts,</tspan><tspan x="335" dy="23">incident handlers,</tspan><tspan x="335" dy="23">threat intel, and</tspan><tspan x="335" dy="23">communications leads for</tspan><tspan x="335" dy="23">a multidisciplinary</tspan></text>
        
          <rect x="606" y="0" width="275" height="430.8" rx="8" fill="#2A1F18" stroke="#FB923C" stroke-width="2.5" />
          <circle cx="743.5" cy="40" r="24" fill="#FB923C" />
          <text x="743.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1410">3</text>
          <text x="622" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FFF7ED">Craft the Scenario</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FDBA74" x="622" y="124"><tspan x="622" dy="0">Create a narrative that</tspan><tspan x="622" dy="23">includes detection cues,</tspan><tspan x="622" dy="23">escalation paths, and</tspan><tspan x="622" dy="23">potential false</tspan><tspan x="622" dy="23">positives.</tspan></text>
        
          <rect x="893" y="0" width="275" height="430.8" rx="8" fill="#2A1F18" stroke="#FB923C" stroke-width="2.5" />
          <circle cx="1030.5" cy="40" r="24" fill="#FB923C" />
          <text x="1030.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1410">4</text>
          <text x="909" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FFF7ED">Conduct the Tabletop</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FDBA74" x="909" y="124"><tspan x="909" dy="0">Run the simulation in a</tspan><tspan x="909" dy="23">controlled setting,</tspan><tspan x="909" dy="23">encouraging real‑time</tspan><tspan x="909" dy="23">decision making and</tspan><tspan x="909" dy="23">communication.</tspan></text>
        
    </g>
  
</svg>