<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Phishing‑Resistant Authentication: The IT Admin’s Playbook">
  <title>Phishing‑Resistant Authentication: The IT Admin’s Playbook</title>
  <desc>Phishing-resistant authentication</desc>
  
    <rect width="100%" height="100%" fill="#0B1220" />
    <rect x="0" y="0" width="1200" height="128" fill="#141C2F" />
    <g transform="translate(32,40)"><path d="M24 8 L40 16 v16 a12 12 0 0 1 -24 0 v-16 Z" fill="none" stroke="#22D3EE" stroke-width="3"/></g>
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#F8FAFC" x="104" y="78"><tspan x="104" dy="0">Phishing‑Resistant Authentication: The IT</tspan><tspan x="104" dy="51.2">Admin’s Playbook</tspan></text>
    <text x="1168" y="78" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">infographic</text>
    <rect x="32" y="156" width="552" height="444" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="56" y="196"><tspan x="56" dy="0">Phishing remains the most common vector for</tspan><tspan x="56" dy="23">credential compromise. By shifting to</tspan><tspan x="56" dy="23">authentication methods that resist spoofing—such</tspan><tspan x="56" dy="23">as biometrics, cryptographic tokens, and adaptive</tspan><tspan x="56" dy="23">behavioral analytics—organizations can close the</tspan><tspan x="56" dy="23">gap that attackers exploit.</tspan></text>
    <g transform="translate(616, 156)">
      
        <rect y="0" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="38" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">1</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="38"><tspan x="48" dy="0">Deploy Hardware Security Modules (HSMs) for</tspan><tspan x="48" dy="23">cryptographic key storage.</tspan></text>
      
        <rect y="108" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="146" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">2</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="146"><tspan x="48" dy="0">Adopt FIDO2/WebAuthn to replace passwords with</tspan><tspan x="48" dy="23">attested credentials.</tspan></text>
      
        <rect y="216" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="254" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">3</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="254"><tspan x="48" dy="0">Implement adaptive risk scoring based on device,</tspan><tspan x="48" dy="23">location, and behavior.</tspan></text>
      
        <rect y="324" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="362" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">4</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="362"><tspan x="48" dy="0">Enforce zero‑trust access controls and continuous</tspan><tspan x="48" dy="23">authentication.</tspan></text>
      
    </g>
  
</svg>