<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Master Incident Response: A Structured Tabletop Drill Blueprint">
  <title>Master Incident Response: A Structured Tabletop Drill Blueprint</title>
  <desc>Incident response tabletop drills</desc>
  
    <rect width="100%" height="100%" fill="#1C1410" />
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#FFF7ED" x="32" y="72"><tspan x="32" dy="0">Master Incident Response: A Structured Tabletop</tspan><tspan x="32" dy="51.2">Drill Blueprint</tspan></text>
    <line x1="32" y1="119.2" x2="1168" y2="119.2" stroke="#5C4033" stroke-width="2" />
    <g transform="translate(0, 143.2)">
      
          <rect x="32" y="0" width="275" height="430.8" rx="8" fill="#2A1F18" stroke="#FB923C" stroke-width="3" />
          <circle cx="169.5" cy="40" r="24" fill="#FB923C" />
          <text x="169.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1410">1</text>
          <text x="48" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FFF7ED">Define Objectives &amp; Scope</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FDBA74" x="48" y="124"><tspan x="48" dy="0">Set measurable goals,</tspan><tspan x="48" dy="23">select attack vectors,</tspan><tspan x="48" dy="23">and determine the</tspan><tspan x="48" dy="23">incident types to</tspan><tspan x="48" dy="23">cover—e.g., ransomware,</tspan></text>
        
          <rect x="319" y="0" width="275" height="430.8" rx="8" fill="#2A1F18" stroke="#FB923C" stroke-width="2.5" />
          <circle cx="456.5" cy="40" r="24" fill="#FB923C" />
          <text x="456.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1410">2</text>
          <text x="335" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FFF7ED">Assemble Team &amp; Roles</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FDBA74" x="335" y="124"><tspan x="335" dy="0">Invite cross-functional</tspan><tspan x="335" dy="23">members (SOC, IT Ops,</tspan><tspan x="335" dy="23">Legal, PR) and assign</tspan><tspan x="335" dy="23">specific</tspan><tspan x="335" dy="23">responsibilities—e.g.,</tspan></text>
        
          <rect x="606" y="0" width="275" height="430.8" rx="8" fill="#2A1F18" stroke="#FB923C" stroke-width="2.5" />
          <circle cx="743.5" cy="40" r="24" fill="#FB923C" />
          <text x="743.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1410">3</text>
          <text x="622" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FFF7ED">Run the Scenario</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FDBA74" x="622" y="124"><tspan x="622" dy="0">Present the incident</tspan><tspan x="622" dy="23">narrative, trigger</tspan><tspan x="622" dy="23">alerts, and let the team</tspan><tspan x="622" dy="23">enact response actions</tspan><tspan x="622" dy="23">while observers track</tspan></text>
        
          <rect x="893" y="0" width="275" height="430.8" rx="8" fill="#2A1F18" stroke="#FB923C" stroke-width="2.5" />
          <circle cx="1030.5" cy="40" r="24" fill="#FB923C" />
          <text x="1030.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1410">4</text>
          <text x="909" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FFF7ED">Debrief &amp; Action Items</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FDBA74" x="909" y="124"><tspan x="909" dy="0">Collect feedback,</tspan><tspan x="909" dy="23">identify deviations,</tspan><tspan x="909" dy="23">update playbooks, and</tspan><tspan x="909" dy="23">schedule follow-up</tspan><tspan x="909" dy="23">drills to reinforce</tspan></text>
        
    </g>
  
</svg>