<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Zero-Trust for Remote Teams: The New Security Imperative">
  <title>Zero-Trust for Remote Teams: The New Security Imperative</title>
  <desc>Zero-trust for remote teams</desc>
  
    <rect width="100%" height="100%" fill="#0F1A14" />
    <rect x="0" y="0" width="1200" height="128" fill="#1A2B22" />
    <g transform="translate(32,40)"><path d="M24 8 L40 16 v16 a12 12 0 0 1 -24 0 v-16 Z" fill="none" stroke="#4ADE80" stroke-width="3"/></g>
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#ECFDF5" x="104" y="78"><tspan x="104" dy="0">Zero-Trust for Remote Teams: The New Security</tspan><tspan x="104" dy="51.2">Imperative</tspan></text>
    <text x="1168" y="78" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#86EFAC">infographic</text>
    <rect x="32" y="156" width="552" height="444" rx="16" fill="#1A2B22" stroke="#3F5E4F" stroke-width="2" />
    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="56" y="196"><tspan x="56" dy="0">Zero‑trust is not a product but a mindset that</tspan><tspan x="56" dy="23">redefines how security is applied in a world</tspan><tspan x="56" dy="23">where employees work from anywhere.</tspan></text>
    <g transform="translate(616, 156)">
      
        <rect y="0" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="38" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">1</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="38"><tspan x="48" dy="0">Continuous verification replaces static trust</tspan><tspan x="48" dy="23">zones.</tspan></text>
      
        <rect y="108" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="146" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">2</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="146"><tspan x="48" dy="0">Zero‑trust identity management ensures only</tspan><tspan x="48" dy="23">authenticated users gain access.</tspan></text>
      
        <rect y="216" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="254" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">3</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="254"><tspan x="48" dy="0">Micro‑segmentation isolates workloads to contain</tspan><tspan x="48" dy="23">lateral movement.</tspan></text>
      
        <rect y="324" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="362" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">4</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="362"><tspan x="48" dy="0">Audit trails and real‑time analytics provide</tspan><tspan x="48" dy="23">actionable threat visibility.</tspan></text>
      
    </g>
  
</svg>