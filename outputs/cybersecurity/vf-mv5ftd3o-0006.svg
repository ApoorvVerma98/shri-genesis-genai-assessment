<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Zero‑Trust Blueprint for Remote Teams">
  <title>Zero‑Trust Blueprint for Remote Teams</title>
  <desc>Zero-trust for remote teams</desc>
  
    <rect width="100%" height="100%" fill="#E0F2FE" />
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#0C4A6E" x="32" y="72"><tspan x="32" dy="0">Zero‑Trust Blueprint for Remote Teams</tspan></text>
    <line x1="32" y1="119.2" x2="1168" y2="119.2" stroke="#7DD3FC" stroke-width="2" />
    <g transform="translate(0, 143.2)">
      
          <rect x="32" y="0" width="275" height="430.8" rx="14" fill="#F0F9FF" stroke="#0369A1" stroke-width="3" />
          <circle cx="169.5" cy="40" r="24" fill="#0369A1" />
          <text x="169.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#E0F2FE">1</text>
          <text x="48" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#0C4A6E">Identify and Classify Assets</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B" x="48" y="124"><tspan x="48" dy="0">Map all remote devices,</tspan><tspan x="48" dy="23">applications, and data</tspan><tspan x="48" dy="23">flows to determine</tspan><tspan x="48" dy="23">sensitivity and access</tspan><tspan x="48" dy="23">requirements.</tspan></text>
        
          <rect x="319" y="0" width="275" height="430.8" rx="14" fill="#F0F9FF" stroke="#0369A1" stroke-width="2" />
          <circle cx="456.5" cy="40" r="24" fill="#0369A1" />
          <text x="456.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#E0F2FE">2</text>
          <text x="335" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#0C4A6E">Enforce Least Privilege</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B" x="335" y="124"><tspan x="335" dy="0">Grant users the minimal</tspan><tspan x="335" dy="23">permissions needed,</tspan><tspan x="335" dy="23">using role‑based or</tspan><tspan x="335" dy="23">attribute‑based controls</tspan><tspan x="335" dy="23">tied to device posture.</tspan></text>
        
          <rect x="606" y="0" width="275" height="430.8" rx="14" fill="#F0F9FF" stroke="#0369A1" stroke-width="2" />
          <circle cx="743.5" cy="40" r="24" fill="#0369A1" />
          <text x="743.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#E0F2FE">3</text>
          <text x="622" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#0C4A6E">Implement Continuous Verification</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B" x="622" y="124"><tspan x="622" dy="0">Apply adaptive</tspan><tspan x="622" dy="23">authentication, session</tspan><tspan x="622" dy="23">monitoring, and</tspan><tspan x="622" dy="23">real‑time risk scoring</tspan><tspan x="622" dy="23">for every access</tspan></text>
        
          <rect x="893" y="0" width="275" height="430.8" rx="14" fill="#F0F9FF" stroke="#0369A1" stroke-width="2" />
          <circle cx="1030.5" cy="40" r="24" fill="#0369A1" />
          <text x="1030.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#E0F2FE">4</text>
          <text x="909" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#0C4A6E">Monitor, Detect, and Respond</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B" x="909" y="124"><tspan x="909" dy="0">Deploy SIEM and EDR</tspan><tspan x="909" dy="23">tools to analyze</tspan><tspan x="909" dy="23">telemetry, detect</tspan><tspan x="909" dy="23">anomalies, and automate</tspan><tspan x="909" dy="23">containment actions.</tspan></text>
        
    </g>
  
</svg>