  <title>Open-Source Observability Stacks: Empowering SREs with Unified Telemetry</title>
  <desc>Open-source observability stacks (variant 2)</desc>
  
    <rect width="100%" height="100%" fill="#1C1410" />
    <rect x="0" y="0" width="1200" height="128" fill="#2A1F18" />
    <g transform="translate(32,40)"><rect x="6" y="6" width="36" height="36" rx="10" fill="none" stroke="#FB923C" stroke-width="3"/><circle cx="24" cy="24" r="8" fill="#FB923C"/></g>
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#FFF7ED" x="104" y="78"><tspan x="104" dy="0">Open-Source Observability Stacks: Empowering</tspan><tspan x="104" dy="51.2">SREs with Unified Telemetry</tspan></text>
    <text x="1168" y="78" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#FDBA74">infographic</text>
