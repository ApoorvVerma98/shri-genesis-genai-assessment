        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FFF7ED" x="48" y="38"><tspan x="48" dy="0">Metrics collection and querying with Prometheus</tspan></text>
      
        <rect y="108" width="552" height="96" rx="8" fill="#1C1410" stroke="#FB923C" stroke-width="2" />
        <text x="20" y="146" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#FB923C">2</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FFF7ED" x="48" y="146"><tspan x="48" dy="0">Distributed tracing powered by Tempo</tspan></text>
      
        <rect y="216" width="552" height="96" rx="8" fill="#1C1410" stroke="#FB923C" stroke-width="2" />
