    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FFF7ED" x="56" y="196"><tspan x="56" dy="0">Open-source observability stacks empower SREs to</tspan><tspan x="56" dy="23">monitor, trace, and debug complex distributed</tspan><tspan x="56" dy="23">systems with minimal vendor lock-in.</tspan></text>
    <g transform="translate(616, 156)">
      
        <rect y="0" width="552" height="96" rx="8" fill="#1C1410" stroke="#FB923C" stroke-width="2" />
