<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Edge AI: Empowering Smart Factories with Real-Time Intelligence">
  <title>Edge AI: Empowering Smart Factories with Real-Time Intelligence</title>
  <desc>Edge AI for smart factories</desc>
  
    <rect width="100%" height="100%" fill="#0B1220" />
    <rect x="32" y="32" width="1136" height="104" rx="12" fill="#22D3EE" />
