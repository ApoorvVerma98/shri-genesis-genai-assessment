    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#0B1220" x="56" y="104"><tspan x="56" dy="0">Edge AI: Empowering Smart Factories with Real-Time Intelligence</tspan></text>
    <g transform="translate(32, 148)">
      
        <rect y="0" width="1136" height="58" rx="6" fill="#141C2F" stroke="#334155" stroke-width="1" />
