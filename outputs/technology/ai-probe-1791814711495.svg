<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Edge AI: Empowering Smart Factories with Real‑Time, On‑Device Intelligence">
  <title>Edge AI: Empowering Smart Factories with Real‑Time, On‑Device Intelligence</title>
  <desc>Edge AI for smart factories</desc>
  
    <rect width="100%" height="100%" fill="#0B1220" />
    <rect x="0" y="0" width="1200" height="128" fill="#141C2F" />
    <g transform="translate(32,40)"><rect x="6" y="6" width="36" height="36" rx="10" fill="none" stroke="#22D3EE" stroke-width="3"/><circle cx="24" cy="24" r="8" fill="#22D3EE"/></g>
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#F8FAFC" x="104" y="78"><tspan x="104" dy="0">Edge AI: Empowering Smart Factories with</tspan><tspan x="104" dy="51.2">Real‑Time, On‑Device Intelligence</tspan></text>
    <text x="1168" y="78" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">infographic</text>
    <rect x="32" y="156" width="552" height="444" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="56" y="196"><tspan x="56" dy="0">Edge AI brings machine learning models directly</tspan><tspan x="56" dy="23">onto industrial IoT devices, enabling instant</tspan><tspan x="56" dy="23">insights and autonomous control without cloud</tspan><tspan x="56" dy="23">latency.</tspan></text>
    <g transform="translate(616, 156)">
      
        <rect y="0" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="38" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">1</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="38"><tspan x="48" dy="0">Zero‑latency decisions: AI runs on‑device,</tspan><tspan x="48" dy="23">eliminating round‑trip delays.</tspan></text>
      
        <rect y="108" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="146" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">2</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="146"><tspan x="48" dy="0">Bandwidth savings: Only critical alerts and</tspan><tspan x="48" dy="23">aggregated data travel to the cloud.</tspan></text>
      
        <rect y="216" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="254" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">3</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="254"><tspan x="48" dy="0">Enhanced safety: Real‑time anomaly detection</tspan><tspan x="48" dy="23">stops hazards before they occur.</tspan></text>
      
        <rect y="324" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="362" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">4</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="362"><tspan x="48" dy="0">Predictive maintenance: Continuous health</tspan><tspan x="48" dy="23">monitoring reduces unplanned downtime.</tspan></text>
      
    </g>
  
</svg>