          <text x="48" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Identify Use Cases</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="48" y="124"><tspan x="48" dy="0">Map out all generative</tspan><tspan x="48" dy="23">AI applications in your</tspan><tspan x="48" dy="23">product, noting data</tspan><tspan x="48" dy="23">sources, user</tspan><tspan x="48" dy="23">interactions, and</tspan></text>
        
