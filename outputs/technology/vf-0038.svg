          <text x="456.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F1A14">2</text>
          <text x="335" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Define Ethical Boundaries</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="335" y="124"><tspan x="335" dy="0">Establish clear policies</tspan><tspan x="335" dy="23">for bias, privacy, and</tspan><tspan x="335" dy="23">content moderation;</tspan><tspan x="335" dy="23">document acceptable</tspan><tspan x="335" dy="23">content and escalation</tspan></text>
        
