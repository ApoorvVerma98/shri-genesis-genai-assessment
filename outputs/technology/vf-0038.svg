          <circle cx="1030.5" cy="40" r="24" fill="#4ADE80" />
          <text x="1030.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F1A14">4</text>
          <text x="909" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Monitor &amp; Iterate</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="909" y="124"><tspan x="909" dy="0">Set up real‑time</tspan><tspan x="909" dy="23">monitoring, collect user</tspan><tspan x="909" dy="23">feedback, and refine</tspan><tspan x="909" dy="23">guardrails in an agile</tspan><tspan x="909" dy="23">cycle to adapt to new</tspan></text>
        
