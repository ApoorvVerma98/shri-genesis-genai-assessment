          <text x="622" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Build Guardrails</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="622" y="124"><tspan x="622" dy="0">Implement technical</tspan><tspan x="622" dy="23">controls—prompt</tspan><tspan x="622" dy="23">filtering, model</tspan><tspan x="622" dy="23">fine‑tuning, and output</tspan><tspan x="622" dy="23">review pipelines—to</tspan></text>
        
