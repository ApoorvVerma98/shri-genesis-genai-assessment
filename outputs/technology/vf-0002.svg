<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Guardrails for Generative AI: Building Trust from the Inside">
  <title>Guardrails for Generative AI: Building Trust from the Inside</title>
  <desc>Responsible generative AI guardrails</desc>
  
    <rect width="100%" height="100%" fill="#0F1A14" />
    <rect x="0" y="0" width="1200" height="128" fill="#1A2B22" />
    <g transform="translate(32,40)"><rect x="6" y="6" width="36" height="36" rx="10" fill="none" stroke="#4ADE80" stroke-width="3"/><circle cx="24" cy="24" r="8" fill="#4ADE80"/></g>
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#ECFDF5" x="104" y="78"><tspan x="104" dy="0">Guardrails for Generative AI: Building Trust</tspan><tspan x="104" dy="51.2">from the Inside</tspan></text>
    <text x="1168" y="78" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#86EFAC">education</text>
    <rect x="32" y="156" width="552" height="444" rx="16" fill="#1A2B22" stroke="#3F5E4F" stroke-width="2" />
    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="56" y="196"><tspan x="56" dy="0">Generative AI offers transformative potential,</tspan><tspan x="56" dy="23">but without intentional guardrails it can amplify</tspan><tspan x="56" dy="23">bias, misinform users, and erode trust. This</tspan><tspan x="56" dy="23">guide distills essential steps product teams can</tspan><tspan x="56" dy="23">take to embed responsibility into every stage of</tspan><tspan x="56" dy="23">the AI lifecycle.</tspan></text>
    <g transform="translate(616, 156)">
      
        <rect y="0" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="38" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">1</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="38"><tspan x="48" dy="0">Define clear scope and intent before model</tspan><tspan x="48" dy="23">training to align outcomes with user needs.</tspan></text>
      
        <rect y="108" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="146" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">2</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="146"><tspan x="48" dy="0">Implement bias‑detection pipelines and continuous</tspan><tspan x="48" dy="23">mitigation to reduce unfair outcomes.</tspan></text>
      
        <rect y="216" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="254" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">3</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="254"><tspan x="48" dy="0">Enforce usage limits and real‑time monitoring</tspan><tspan x="48" dy="23">dashboards to catch anomalies early.</tspan></text>
      
        <rect y="324" width="552" height="96" rx="16" fill="#0F1A14" stroke="#4ADE80" stroke-width="2" />
        <text x="20" y="362" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#4ADE80">4</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5" x="48" y="362"><tspan x="48" dy="0">Provide transparent explanations and user‑control</tspan><tspan x="48" dy="23">options so stakeholders understand model decisi…</tspan></text>
      
    </g>
  
</svg>