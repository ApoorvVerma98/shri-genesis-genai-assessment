    <text x="308" y="155.2" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#22D3EE">Traditional Factory AI</text>
    <text x="892" y="155.2" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#6366F1">Edge AI Smart Factory</text>
    
      <circle cx="60" cy="199.2" r="6" fill="#22D3EE" />
      <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="80" y="205.2"><tspan x="80" dy="0">High latency due to cloud round‑trip</tspan></text>
    
      <circle cx="60" cy="251.2" r="6" fill="#22D3EE" />
      <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="80" y="257.2"><tspan x="80" dy="0">Delayed fault detection</tspan></text>
    
      <circle cx="60" cy="303.2" r="6" fill="#22D3EE" />
