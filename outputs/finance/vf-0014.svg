          <text x="169.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F1A14">1</text>
          <text x="48" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Step 1: Spot the Label</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="48" y="124"><tspan x="48" dy="0">Locate the ESG label on</tspan><tspan x="48" dy="23">the fund’s prospectus or</tspan><tspan x="48" dy="23">marketing materials.</tspan><tspan x="48" dy="23">Common labels include</tspan><tspan x="48" dy="23">MSCI ESG,</tspan></text>
        
          <rect x="319" y="0" width="275" height="430.8" rx="16" fill="#1A2B22" stroke="#4ADE80" stroke-width="2" />
          <circle cx="456.5" cy="40" r="24" fill="#4ADE80" />
          <text x="456.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F1A14">2</text>
          <text x="335" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Step 2: Review the Criteria</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="335" y="124"><tspan x="335" dy="0">Each label has its own</tspan><tspan x="335" dy="23">set of criteria. Check</tspan><tspan x="335" dy="23">whether it focuses on</tspan><tspan x="335" dy="23">carbon reduction,</tspan><tspan x="335" dy="23">diversity, or</tspan></text>
        
          <rect x="606" y="0" width="275" height="430.8" rx="16" fill="#1A2B22" stroke="#4ADE80" stroke-width="2" />
          <circle cx="743.5" cy="40" r="24" fill="#4ADE80" />
          <text x="743.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F1A14">3</text>
          <text x="622" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Step 3: Examine the Methodology</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="622" y="124"><tspan x="622" dy="0">Look for details on data</tspan><tspan x="622" dy="23">sources, weighting, and</tspan><tspan x="622" dy="23">scoring. Transparent</tspan><tspan x="622" dy="23">methodologies give</tspan><tspan x="622" dy="23">confidence in the</tspan></text>
        
          <rect x="893" y="0" width="275" height="430.8" rx="16" fill="#1A2B22" stroke="#4ADE80" stroke-width="2" />
          <circle cx="1030.5" cy="40" r="24" fill="#4ADE80" />
          <text x="1030.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F1A14">4</text>
          <text x="909" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Step 4: Align with Your Goals</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="909" y="124"><tspan x="909" dy="0">Compare the label’s</tspan><tspan x="909" dy="23">focus areas to your</tspan><tspan x="909" dy="23">personal sustainability</tspan><tspan x="909" dy="23">priorities and risk</tspan><tspan x="909" dy="23">tolerance before adding</tspan></text>
        
