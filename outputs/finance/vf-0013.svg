<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Your 3‑Step Blueprint to a Secure Emergency Fund">
  <title>Your 3‑Step Blueprint to a Secure Emergency Fund</title>
  <desc>Building an emergency fund roadmap</desc>
  
    <rect width="100%" height="100%" fill="#0B1220" />
    <rect x="0" y="0" width="1200" height="128" fill="#141C2F" />
    <g transform="translate(32,40)"><circle cx="24" cy="24" r="20" fill="none" stroke="#22D3EE" stroke-width="3"/><text x="24" y="30" text-anchor="middle" font-size="22" fill="#22D3EE" font-family="sans-serif">$</text></g>
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#F8FAFC" x="104" y="78"><tspan x="104" dy="0">Your 3‑Step Blueprint to a Secure Emergency</tspan><tspan x="104" dy="51.2">Fund</tspan></text>
    <text x="1168" y="78" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">infographic</text>
    <rect x="32" y="156" width="552" height="444" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="56" y="196"><tspan x="56" dy="0">An emergency fund is your financial safety net,</tspan><tspan x="56" dy="23">giving you peace of mind and freedom to focus on</tspan><tspan x="56" dy="23">growth.</tspan></text>
    <g transform="translate(616, 156)">
      
        <rect y="0" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="38" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">1</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="38"><tspan x="48" dy="0">Set a Clear Target: Aim for 3–6 months of living</tspan><tspan x="48" dy="23">costs.</tspan></text>
      
        <rect y="108" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="146" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">2</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="146"><tspan x="48" dy="0">Start Small: Commit to a modest monthly</tspan><tspan x="48" dy="23">contribution—$200 or a percentage of your</tspan></text>
      
        <rect y="216" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="254" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">3</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="254"><tspan x="48" dy="0">Automate Deposits: Let your bank handle the</tspan><tspan x="48" dy="23">transfer so you never forget.</tspan></text>
      
        <rect y="324" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />
        <text x="20" y="362" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">4</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="362"><tspan x="48" dy="0">Track Progress: Use a simple spreadsheet or app</tspan><tspan x="48" dy="23">to visualize your growing cushion.</tspan></text>
      
    </g>
  
</svg>