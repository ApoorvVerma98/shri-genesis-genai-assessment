<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Cash Flow Pulse: Keep Your Small Business Running Smoothly">
  <title>Cash Flow Pulse: Keep Your Small Business Running Smoothly</title>
  <desc>Small business cash flow cadence</desc>
  
    <rect width="100%" height="100%" fill="#0F1A14" />
    
        <path id="motif-waves" opacity="0.25" fill="#2DD4BF" d="M0 441 Q 300 346.5 600 441 T 1200 409.5 L 1200 630 L 0 630 Z" />
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#ECFDF5" x="32" y="72"><tspan x="32" dy="0">Cash Flow Pulse: Keep Your Small Business Running</tspan><tspan x="32" dy="51.2">Smoothly</tspan></text>
    <text x="32" y="105.2" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC">Track weekly revenue, expenses, and cash reserves to forecast liquidity, avoid surprises, and plan growth.</text>
    
        <rect x="32" y="158.4" width="558" height="148" rx="16" fill="#1A2B22" stroke="#3F5E4F" stroke-width="2" />
        <text x="56" y="214.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#4ADE80">$5k–$10k*</text>
        <text x="56" y="250.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5">Weekly Revenue</text>
        <text x="56" y="280.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#86EFAC">Typical range for most SMBs</text>
      
        <rect x="610" y="158.4" width="558" height="148" rx="16" fill="#1A2B22" stroke="#3F5E4F" stroke-width="2" />
        <text x="634" y="214.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#4ADE80">$1k–$2k per week*</text>
        <text x="634" y="250.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5">Cash Burn Rate</text>
        <text x="634" y="280.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#86EFAC">How fast cash is used</text>
      
        <rect x="32" y="326.4" width="558" height="148" rx="16" fill="#1A2B22" stroke="#3F5E4F" stroke-width="2" />
        <text x="56" y="382.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#4ADE80">3–6 weeks of burn*</text>
        <text x="56" y="418.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5">Cash Cushion</text>
        <text x="56" y="448.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#86EFAC">Buffer before runway runs low</text>
      
        <rect x="610" y="326.4" width="558" height="148" rx="16" fill="#1A2B22" stroke="#3F5E4F" stroke-width="2" />
        <text x="634" y="382.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#4ADE80">30–45 days*</text>
        <text x="634" y="418.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#ECFDF5">Accounts Receivable Turnover</text>
        <text x="634" y="448.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#86EFAC">Average collection period</text>
      
    <text x="32" y="598" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12" fill="#86EFAC">* Illustrative metrics unless sourced</text>
  
</svg>