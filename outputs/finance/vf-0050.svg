          <text x="335" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">2. Understand the Rating Scale</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="335" y="124"><tspan x="335" dy="0">Review the scale (e.g.,</tspan><tspan x="335" dy="23">0-5 stars, 0-100 points)</tspan><tspan x="335" dy="23">and what each level</tspan><tspan x="335" dy="23">signifies in terms of</tspan><tspan x="335" dy="23">ESG performance.</tspan></text>
        
