          <text x="48" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">1. Identify the Label Source</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="48" y="124"><tspan x="48" dy="0">Determine which agency</tspan><tspan x="48" dy="23">issued the ESG</tspan><tspan x="48" dy="23">rating—common ones</tspan><tspan x="48" dy="23">include MSCI,</tspan><tspan x="48" dy="23">Sustainalytics, and</tspan></text>
        
