<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Urban Tree Canopies: Growing Green, Cooling Cities">
  <title>Urban Tree Canopies: Growing Green, Cooling Cities</title>
  <desc>Urban tree canopy benefits</desc>
  
    <rect width="100%" height="100%" fill="#141C2F" />
    <rect x="0" y="0" width="1200" height="96" fill="#22D3EE" />
    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#0B1220" x="32" y="58"><tspan x="32" dy="0">Urban Tree Canopies: Growing Green, Cooling Cities</tspan></text>
    
        <rect x="32" y="112" width="558" height="156" rx="12" fill="#0B1220" stroke="#334155" stroke-width="2" />
        <rect x="32" y="112" width="8" height="156" rx="4" fill="#F472B6" />
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="56" y="164"><tspan x="56" dy="0">Natural cooling: trees provide shade and</tspan><tspan x="56" dy="23">evapotranspiration, lowering street temperatures by</tspan><tspan x="56" dy="23">up to several degrees.</tspan></text>
      
        <rect x="610" y="112" width="558" height="156" rx="12" fill="#0B1220" stroke="#334155" stroke-width="2" />
        <rect x="610" y="112" width="8" height="156" rx="4" fill="#F472B6" />
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="634" y="164"><tspan x="634" dy="0">Air purification: foliage captures particulate</tspan><tspan x="634" dy="23">matter and absorbs CO₂, improving air quality for</tspan><tspan x="634" dy="23">residents.</tspan></text>
      
        <rect x="32" y="288" width="558" height="156" rx="12" fill="#0B1220" stroke="#334155" stroke-width="2" />
        <rect x="32" y="288" width="8" height="156" rx="4" fill="#F472B6" />
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="56" y="340"><tspan x="56" dy="0">Community connectivity: tree-lined streets</tspan><tspan x="56" dy="23">encourage walking, social interaction, and a sense</tspan><tspan x="56" dy="23">of place.</tspan></text>
      
        <rect x="610" y="288" width="558" height="156" rx="12" fill="#0B1220" stroke="#334155" stroke-width="2" />
        <rect x="610" y="288" width="8" height="156" rx="4" fill="#F472B6" />
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="634" y="340"><tspan x="634" dy="0">Stormwater management: canopy intercepts rain,</tspan><tspan x="634" dy="23">reducing runoff and mitigating flood risk.</tspan></text>
      
        <rect x="32" y="464" width="558" height="156" rx="12" fill="#0B1220" stroke="#334155" stroke-width="2" />
        <rect x="32" y="464" width="8" height="156" rx="4" fill="#F472B6" />
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="56" y="516"><tspan x="56" dy="0">Economic value: well-maintained trees increase</tspan><tspan x="56" dy="23">property values and attract businesses.</tspan></text>
      
  
</svg>