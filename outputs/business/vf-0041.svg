    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FAF5FF" x="56" y="196"><tspan x="56" dy="0">This infographic breaks down the essential</tspan><tspan x="56" dy="23">elements of a scalable playbook—alignment,</tspan><tspan x="56" dy="23">automation, analytics, and continuous</tspan><tspan x="56" dy="23">improvement—so you can deploy them across teams</tspan><tspan x="56" dy="23">and regions.</tspan></text>
