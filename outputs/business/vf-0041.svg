        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FAF5FF" x="48" y="254"><tspan x="48" dy="0">Automate Repetitive Tasks with Workflow Templates</tspan><tspan x="48" dy="23">and AI nudges.</tspan></text>
      
        <rect y="324" width="552" height="96" rx="20" fill="#1A0B1F" stroke="#E879F9" stroke-width="2" />
