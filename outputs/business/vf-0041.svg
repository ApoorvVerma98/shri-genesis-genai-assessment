        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FAF5FF" x="48" y="38"><tspan x="48" dy="0">Define Core Success Metrics that align with</tspan><tspan x="48" dy="23">business goals.</tspan></text>
      
        <rect y="108" width="552" height="96" rx="20" fill="#1A0B1F" stroke="#E879F9" stroke-width="2" />
