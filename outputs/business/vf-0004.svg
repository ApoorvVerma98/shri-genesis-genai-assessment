          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B" x="48" y="124"><tspan x="48" dy="0">Interview target buyers,</tspan><tspan x="48" dy="23">confirm pain points, and</tspan><tspan x="48" dy="23">test a minimal landing</tspan><tspan x="48" dy="23">page.</tspan></text>
        
