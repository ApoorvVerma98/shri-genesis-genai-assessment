<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Preventive Care Awareness Week: Your Health, Your Choice!">
  <title>Preventive Care Awareness Week: Your Health, Your Choice!</title>
  <desc>Preventive care awareness week</desc>
  
    <rect width="100%" height="100%" fill="#1A0B1F" />
    <rect x="32" y="32" width="1136" height="104" rx="20" fill="#E879F9" />
    <text x="56" y="68" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#1A0B1F">ANNOUNCEMENT</text>
    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#1A0B1F" x="56" y="104"><tspan x="56" dy="0">Preventive Care Awareness Week: Your Health, Your Choice!</tspan></text>
    <g transform="translate(32, 148)">
      
        <rect y="0" width="1136" height="58" rx="10" fill="#2A1233" stroke="#581C87" stroke-width="1" />
        <circle cx="28" cy="29" r="8" fill="#38BDF8" />
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FAF5FF" x="52" y="36"><tspan x="52" dy="0">Schedule your annual check‑up: early detection saves lives.</tspan></text>
      
        <rect y="68" width="1136" height="58" rx="10" fill="#2A1233" stroke="#581C87" stroke-width="1" />
        <circle cx="28" cy="97" r="8" fill="#38BDF8" />
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FAF5FF" x="52" y="104"><tspan x="52" dy="0">Get vaccinated: protect yourself and your loved ones.</tspan></text>
      
        <rect y="136" width="1136" height="58" rx="10" fill="#2A1233" stroke="#581C87" stroke-width="1" />
        <circle cx="28" cy="165" r="8" fill="#38BDF8" />
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FAF5FF" x="52" y="172"><tspan x="52" dy="0">Stay active: 30 minutes of walking daily keeps the doctor away.</tspan></text>
      
        <rect y="204" width="1136" height="58" rx="10" fill="#2A1233" stroke="#581C87" stroke-width="1" />
        <circle cx="28" cy="233" r="8" fill="#38BDF8" />
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#FAF5FF" x="52" y="240"><tspan x="52" dy="0">Eat balanced meals: colorful plates mean better nutrition.</tspan></text>
      
    </g>
    <text x="32" y="598" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#D8B4FE">Take the first step toward a healthier you—discover simple habits that keep you thriving.</text>
  
</svg>