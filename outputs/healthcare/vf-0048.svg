<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Boost Medication Adherence: Practical Tips for Caregivers">
  <title>Boost Medication Adherence: Practical Tips for Caregivers</title>
  <desc>Medication adherence tips (variant 2)</desc>
  
    <rect width="100%" height="100%" fill="#E0F2FE" />
    <rect x="0" y="0" width="1200" height="128" fill="#F0F9FF" />
    <g transform="translate(32,40)"><rect width="48" height="48" rx="8" fill="#0369A1" opacity="0.2"/><path d="M24 12 v24 M14 24 h20" stroke="#0369A1" stroke-width="4" fill="none"/></g>
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#0C4A6E" x="104" y="78"><tspan x="104" dy="0">Boost Medication Adherence: Practical Tips for</tspan><tspan x="104" dy="51.2">Caregivers</tspan></text>
    <text x="1168" y="78" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">infographic</text>
    <rect x="32" y="156" width="552" height="444" rx="14" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="2" />
    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#0C4A6E" x="56" y="196"><tspan x="56" dy="0"></tspan></text>
    <g transform="translate(616, 156)">
      
        <rect y="0" width="552" height="96" rx="14" fill="#E0F2FE" stroke="#0369A1" stroke-width="2" />
        <text x="20" y="38" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0369A1">1</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#0C4A6E" x="48" y="38"><tspan x="48" dy="0">Use a pill organizer and label each compartment</tspan><tspan x="48" dy="23">with name, dose, and time.</tspan></text>
      
        <rect y="108" width="552" height="96" rx="14" fill="#E0F2FE" stroke="#0369A1" stroke-width="2" />
        <text x="20" y="146" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0369A1">2</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#0C4A6E" x="48" y="146"><tspan x="48" dy="0">Set phone alarms or use medication reminder apps</tspan><tspan x="48" dy="23">that sync across devices.</tspan></text>
      
        <rect y="216" width="552" height="96" rx="14" fill="#E0F2FE" stroke="#0369A1" stroke-width="2" />
        <text x="20" y="254" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0369A1">3</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#0C4A6E" x="48" y="254"><tspan x="48" dy="0">Create a daily routine: pair medication time with</tspan><tspan x="48" dy="23">a regular activity like breakfast.</tspan></text>
      
        <rect y="324" width="552" height="96" rx="14" fill="#E0F2FE" stroke="#0369A1" stroke-width="2" />
        <text x="20" y="362" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0369A1">4</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#0C4A6E" x="48" y="362"><tspan x="48" dy="0">Keep a medication log and review it weekly to</tspan><tspan x="48" dy="23">catch missed doses early.</tspan></text>
      
    </g>
  
</svg>