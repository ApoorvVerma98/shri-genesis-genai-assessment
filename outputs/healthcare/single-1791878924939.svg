<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Edge AI: The New Frontier for Smart Factory Healthcare">
  <title>Edge AI: The New Frontier for Smart Factory Healthcare</title>
  <desc>Edge AI for smart factories</desc>
  

    <rect width="100%" height="100%" fill="#0B1220" />

    <rect x="0" y="0" width="1200" height="128" fill="#141C2F" />

    <g transform="translate(32,40)"><rect width="48" height="48" rx="8" fill="#22D3EE" opacity="0.2"/><path d="M24 12 v24 M14 24 h20" stroke="#22D3EE" stroke-width="4" fill="none"/></g>

    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#F8FAFC" x="104" y="78"><tspan x="104" dy="0">Edge AI: The New Frontier for Smart Factory</tspan><tspan x="104" dy="51.2">Healthcare</tspan></text>

    <text x="1168" y="78" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">infographic</text>

    <rect x="32" y="156" width="552" height="444" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />

    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="56" y="196"><tspan x="56" dy="0">Edge AI brings intelligence directly to the</tspan><tspan x="56" dy="23">factory floor, enabling instant decision-making</tspan><tspan x="56" dy="23">while safeguarding sensitive healthcare data.</tspan></text>

    <g transform="translate(616, 156)">

      

        <rect y="0" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />

        <text x="20" y="38" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">1</text>

        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="38"><tspan x="48" dy="0">Decentralized data reduces latency, enabling</tspan><tspan x="48" dy="23">instant anomaly detection on the shop floor.</tspan></text>

      

        <rect y="108" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />

        <text x="20" y="146" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">2</text>

        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="146"><tspan x="48" dy="0">Edge AI preserves patient data privacy by</tspan><tspan x="48" dy="23">processing sensitive metrics locally.</tspan></text>

      

        <rect y="216" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />

        <text x="20" y="254" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">3</text>

        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="254"><tspan x="48" dy="0">Predictive maintenance powered by on-device</tspan><tspan x="48" dy="23">models proactively reduces downtime.</tspan></text>

      

        <rect y="324" width="552" height="96" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-width="2" />

        <text x="20" y="362" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE">4</text>

        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC" x="48" y="362"><tspan x="48" dy="0">Seamless integration with existing MES through</tspan><tspan x="48" dy="23">lightweight APIs and secure MQTT.</tspan></text>

      

    </g>

  
</svg>