    <line x1="32" y1="119.2" x2="1168" y2="119.2" stroke="#581C87" stroke-width="2" />
    <g transform="translate(0, 143.2)">
      
          <rect x="32" y="0" width="275" height="430.8" rx="20" fill="#2A1233" stroke="#E879F9" stroke-width="3" />
