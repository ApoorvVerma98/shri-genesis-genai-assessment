          <text x="169.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1A0B1F">1</text>
          <text x="48" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FAF5FF">Define Your Goals</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#D8B4FE" x="48" y="124"><tspan x="48" dy="0">Identify which</tspan><tspan x="48" dy="23">certification aligns</tspan><tspan x="48" dy="23">with your project’s</tspan><tspan x="48" dy="23">scope, location, and</tspan><tspan x="48" dy="23">stakeholder priorities.</tspan></text>
        
          <rect x="319" y="0" width="275" height="430.8" rx="20" fill="#2A1233" stroke="#E879F9" stroke-width="2" />
          <circle cx="456.5" cy="40" r="24" fill="#E879F9" />
          <text x="456.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1A0B1F">2</text>
          <text x="335" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FAF5FF">Engage a Certified Design Team</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#D8B4FE" x="335" y="124"><tspan x="335" dy="0">Hire architects and</tspan><tspan x="335" dy="23">consultants familiar</tspan><tspan x="335" dy="23">with the chosen standard</tspan><tspan x="335" dy="23">to embed criteria from</tspan><tspan x="335" dy="23">the start.</tspan></text>
        
          <rect x="606" y="0" width="275" height="430.8" rx="20" fill="#2A1233" stroke="#E879F9" stroke-width="2" />
          <circle cx="743.5" cy="40" r="24" fill="#E879F9" />
          <text x="743.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1A0B1F">3</text>
          <text x="622" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FAF5FF">Integrate Sustainable Design Elements</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#D8B4FE" x="622" y="124"><tspan x="622" dy="0">Incorporate</tspan><tspan x="622" dy="23">energy‑efficient</tspan><tspan x="622" dy="23">systems, low‑impact</tspan><tspan x="622" dy="23">materials, and</tspan><tspan x="622" dy="23">indoor‑environment</tspan></text>
        
          <rect x="893" y="0" width="275" height="430.8" rx="20" fill="#2A1233" stroke="#E879F9" stroke-width="2" />
          <circle cx="1030.5" cy="40" r="24" fill="#E879F9" />
          <text x="1030.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1A0B1F">4</text>
          <text x="909" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FAF5FF">Complete Documentation &amp; Submit for Assessment</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#D8B4FE" x="909" y="124"><tspan x="909" dy="0">Prepare the required</tspan><tspan x="909" dy="23">evidence, conduct site</tspan><tspan x="909" dy="23">audits, and file with</tspan><tspan x="909" dy="23">the certifying body to</tspan><tspan x="909" dy="23">receive your green</tspan></text>
        
