<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Turn One Piece of Content Into a Multi-Channel Powerhouse">
  <title>Turn One Piece of Content Into a Multi-Channel Powerhouse</title>
  <desc>Content repurposing across channels (variant 2)</desc>
  
    <rect width="100%" height="100%" fill="#F1F5F9" />
    <rect x="0" y="0" width="1200" height="128" fill="#FFFFFF" />
    <g transform="translate(32,40)"><rect x="6" y="6" width="36" height="36" rx="10" fill="none" stroke="#0F172A" stroke-width="3"/><circle cx="24" cy="24" r="8" fill="#0F172A"/></g>
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#0F172A" x="104" y="78"><tspan x="104" dy="0">Turn One Piece of Content Into a Multi-Channel</tspan><tspan x="104" dy="51.2">Powerhouse</tspan></text>
    <text x="1168" y="78" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">infographic</text>
    <rect x="32" y="156" width="552" height="444" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#0F172A" x="56" y="196"><tspan x="56" dy="0">Every piece of content deserves a second</tspan><tspan x="56" dy="23">life—discover how to amplify reach, save time,</tspan><tspan x="56" dy="23">and boost ROI.</tspan></text>
    <g transform="translate(616, 156)">
      
        <rect y="0" width="552" height="96" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="2" />
        <text x="20" y="38" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">1</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#0F172A" x="48" y="38"><tspan x="48" dy="0">Start with a core story: pick the main takeaway</tspan><tspan x="48" dy="23">that resonates across audiences.</tspan></text>
      
        <rect y="108" width="552" height="96" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="2" />
        <text x="20" y="146" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">2</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#0F172A" x="48" y="146"><tspan x="48" dy="0">Transform the story into bite‑size formats:</tspan><tspan x="48" dy="23">carousel posts, short clips, and infographics.</tspan></text>
      
        <rect y="216" width="552" height="96" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="2" />
        <text x="20" y="254" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">3</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#0F172A" x="48" y="254"><tspan x="48" dy="0">Tailor the voice: tweak tone and length for each</tspan><tspan x="48" dy="23">platform while keeping the core message.</tspan></text>
      
        <rect y="324" width="552" height="96" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="2" />
        <text x="20" y="362" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">4</text>
        <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#0F172A" x="48" y="362"><tspan x="48" dy="0">Schedule smartly: use a content calendar to time</tspan><tspan x="48" dy="23">releases for maximum reach.</tspan></text>
      
    </g>
  
</svg>