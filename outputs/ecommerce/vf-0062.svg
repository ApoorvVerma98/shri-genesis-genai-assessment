<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Act Now: Secure Your Holiday Fulfillment Pipeline">
  <title>Act Now: Secure Your Holiday Fulfillment Pipeline</title>
  <desc>Holiday fulfillment readiness (variant 2)</desc>
  
    <rect width="100%" height="100%" fill="#0F1A14" />
    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#ECFDF5" x="32" y="72"><tspan x="32" dy="0">Act Now: Secure Your Holiday Fulfillment Pipeline</tspan></text>
    <line x1="32" y1="119.2" x2="1168" y2="119.2" stroke="#3F5E4F" stroke-width="2" />
    <g transform="translate(0, 143.2)">
      
          <rect x="32" y="0" width="275" height="430.8" rx="16" fill="#1A2B22" stroke="#4ADE80" stroke-width="3" />
          <circle cx="169.5" cy="40" r="24" fill="#4ADE80" />
          <text x="169.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F1A14">1</text>
          <text x="48" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Audit Inventory Levels</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="48" y="124"><tspan x="48" dy="0">Verify stock against</tspan><tspan x="48" dy="23">projected demand;</tspan><tspan x="48" dy="23">reorder critical SKUs</tspan><tspan x="48" dy="23">before the first holiday</tspan><tspan x="48" dy="23">wave.</tspan></text>
        
          <rect x="319" y="0" width="275" height="430.8" rx="16" fill="#1A2B22" stroke="#4ADE80" stroke-width="2" />
          <circle cx="456.5" cy="40" r="24" fill="#4ADE80" />
          <text x="456.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F1A14">2</text>
          <text x="335" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Ramp Up Staffing</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="335" y="124"><tspan x="335" dy="0">Schedule overtime and</tspan><tspan x="335" dy="23">cross‑train teams;</tspan><tspan x="335" dy="23">ensure coverage for peak</tspan><tspan x="335" dy="23">pick‑and‑pack and</tspan><tspan x="335" dy="23">returns.</tspan></text>
        
          <rect x="606" y="0" width="275" height="430.8" rx="16" fill="#1A2B22" stroke="#4ADE80" stroke-width="2" />
          <circle cx="743.5" cy="40" r="24" fill="#4ADE80" />
          <text x="743.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F1A14">3</text>
          <text x="622" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Lock Carrier Capacity</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="622" y="124"><tspan x="622" dy="0">Confirm delivery slots</tspan><tspan x="622" dy="23">with carriers; negotiate</tspan><tspan x="622" dy="23">surge pricing and backup</tspan><tspan x="622" dy="23">routes.</tspan></text>
        
          <rect x="893" y="0" width="275" height="430.8" rx="16" fill="#1A2B22" stroke="#4ADE80" stroke-width="2" />
          <circle cx="1030.5" cy="40" r="24" fill="#4ADE80" />
          <text x="1030.5" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F1A14">4</text>
          <text x="909" y="92" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ECFDF5">Test Order Flow</text>
          <text font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#86EFAC" x="909" y="124"><tspan x="909" dy="0">Run end‑to‑end test</tspan><tspan x="909" dy="23">orders; validate picking</tspan><tspan x="909" dy="23">accuracy, packing, and</tspan><tspan x="909" dy="23">shipping confirmations.</tspan></text>
        
    </g>
  
</svg>