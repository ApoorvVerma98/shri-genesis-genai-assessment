    <text font-family="Georgia, Cambria, Times New Roman, serif" font-size="40" font-weight="700" fill="#F8FAFC" x="32" y="72"><tspan x="32" dy="0">Edge AI Drives Smart Factory Efficiency</tspan></text>
    <text x="32" y="105.2" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8">Integrating real-time AI at the edge transforms production, reduces downtime, and boosts ecommerce fulfillment.</text>
    
        <rect x="32" y="158.4" width="558" height="148" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
        <text x="56" y="214.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#22D3EE">30%–50% lower*</text>
        <text x="56" y="250.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC">Production Downtime Reduction</text>
        
      
        <rect x="610" y="158.4" width="558" height="148" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
        <text x="634" y="214.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#22D3EE">sub‑5 ms*</text>
        <text x="634" y="250.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC">AI Decision Latency</text>
        
      
        <rect x="32" y="326.4" width="558" height="148" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
