    <text x="32" y="105.2" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8">Track conversion rates, cart abandonment, order values, and checkout speed to drive revenue.</text>
    
        <rect x="32" y="158.4" width="558" height="148" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
        <text x="56" y="214.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#22D3EE">≈75%*</text>
        <text x="56" y="250.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC">Conversion Rate</text>
        
      
        <rect x="610" y="158.4" width="558" height="148" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
        <text x="634" y="214.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#22D3EE">≈40%*</text>
        <text x="634" y="250.4" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" fill="#F8FAFC">Cart Abandonment Rate</text>
        
      
        <rect x="32" y="326.4" width="558" height="148" rx="12" fill="#141C2F" stroke="#334155" stroke-width="2" />
